[package]
name = "asteroid-tui"
version = "1.0.3"
authors = ["Sirio Negri <ziriuz84@gmail.com>"]
description = "Tools for minor planets researchers: observation scheduling and planning"
readme = "README.md"
repository = "https://github.com/ziriuz84/asteroid_tui"
homepage = "https://github.com/ziriuz84/asteroid_tui"
license = "MIT"
edition = "2021"
keywords = ["astronomy", "asteroids", "tui", "observation"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "asteroid-tui"
path = "src/main.rs"

[dependencies]
human-panic = "2.0.2"
astro = "2.0.0"
anyhow = "1.0.97"
config = "0.15.11"
promkit = "0.8.0"
dirs = "6.0.0"
reqwest = { version = "0.12.14", features = ["blocking", "json"] }
scraper = "0.23.1"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.140"
serde_repr = "0.1.20"
chrono = "0.4.40"
rand = "0.9.0"
toml = "0.8.20"
comfy-table = "7.1.4"
urlencoding = "2.1.3"
percent-encoding = "2.3.1"
regex = "1.11.1"
astronav = "0.2.5"
