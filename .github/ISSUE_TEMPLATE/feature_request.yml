name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. For informal ideas or questions, consider [GitHub Discussions](https://github.com/ziriuz84/asteroid_tui/discussions) instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What observation-planning problem are you trying to solve?
      placeholder: "e.g. I need to compare targets across multiple nights before opening the observatory..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like asteroid-tui to do?
    validations:
      required: true

  - type: dropdown
    id: scheduling_area
    attributes:
      label: Related area
      options:
        - Weather forecast
        - Sun and moon times
        - Observing target list
        - Settings
        - New module
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workflows, or workarounds you have tried
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature
        - label: I can help with documentation only
        - label: I cannot contribute code or docs at this time
